<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ✅ Mobile-first viewport — prevents zoom-out on small screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <meta name="description" content="NexusTech Hub — Premium electronics and cutting-edge tech gadgets. Shop laptops, smartphones, accessories, gaming gear and more." />
    <meta name="theme-color" content="#FF724C" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexustechhub.com/" />
    <meta property="og:title" content="NexusTech Hub — Premium Electronics" />
    <meta property="og:description" content="Premium electronics and cutting-edge tech gadgets. Shop laptops, smartphones, accessories, gaming gear and more." />
    <meta property="og:image" content="https://nexustechhub.com/logo%20icon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nexustechhub.com/" />
    <meta property="twitter:title" content="NexusTech Hub — Premium Electronics" />
    <meta property="twitter:description" content="Premium electronics and cutting-edge tech gadgets. Shop laptops, smartphones, accessories, gaming gear and more." />
    <meta property="twitter:image" content="https://nexustechhub.com/logo%20icon.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "NexusTech Hub",
        "image": "https://nexustechhub.com/logo%20icon.png",
        "description": "Premium electronics and cutting-edge tech gadgets.",
        "url": "https://nexustechhub.com"
      }
    </script>

    <!-- iOS Safari full-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>NexusTech Hub — Premium Electronics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
